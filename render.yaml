services:
  - type: web
    name: mg-gestion
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: PORT
        value: 10000
    staticPublicPath: dist
    preDeployCommand: npx prisma migrate deploy
